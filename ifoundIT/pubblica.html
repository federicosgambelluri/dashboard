<p class="text-gray-600 dark:text-gray-400 mb-8">Fill out the form below to help reunite a lost item with its owner.</p>
<form action="#" class="space-y-6">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="images">Upload Images</label>
<div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 dark:border-gray-600 border-dashed rounded-lg bg-background-light dark:bg-background-dark">
<div class="space-y-1 text-center">
<span class="material-symbols-outlined text-4xl text-gray-400 dark:text-gray-500">
                  add_a_photo
                </span>
<div class="flex text-sm text-gray-600 dark:text-gray-400">
<label class="relative cursor-pointer bg-white dark:bg-background-dark rounded font-medium text-primary hover:text-primary/80 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 dark:focus-within:ring-offset-background-dark focus-within:ring-primary" for="file-upload">
<span>Upload a file</span>
<input class="sr-only" id="file-upload" multiple="" name="file-upload" type="file"/>
</label>
<p class="pl-1">or drag and drop</p>
</div>
<p class="text-xs text-gray-500 dark:text-gray-500">PNG, JPG, GIF up to 10MB</p>
</div>
</div>
</div>
<div>

</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="location">Location Found</label>
<div class="relative">
<input class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900/50 focus:border-primary focus:ring-primary text-sm pl-10 placeholder-gray-400 dark:placeholder-gray-500" id="location" name="location" placeholder="e.g., Central Park, near the fountain" type="text"/>
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-gray-400 dark:text-gray-500">location_on</span>
</div>
</div>
<div class="mt-4 h-64 w-full rounded-lg bg-gray-200 dark:bg-gray-700 bg-cover bg-center" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCJQtrtayv6B17vdU8ZAR_R1BiBRbZ9zN_932MP1MPCEB5NbVNJjzZwF3RhRjUw3Zp3mj7sQIPhIilf6-ErL-3oTDzmiWBM45UjBn0KyH2FaMRrO_usTFHUz6AA2TmcIFvev0EetNlw1PUua1SGX0fVTKps7LTq7pDsD0URe66tSXHFW82wWdREpUar9h-Klb0Eg3Rbzld7VPeMyD-TmENTvtlRp_7neQvmcoglKLA7aDqzgUOGrtiC-2PZvzSa724lw3YjU5lMF6Fd");'>

<input class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900/50 focus:border-primary focus:ring-primary text-sm text-gray-500 dark:text-gray-400" id="date-found" name="date-found" type="date"/>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="contact">Your Contact Info</label>
<input class="w-full rounded-lg border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900/50 focus:border-primary focus:ring-primary text-sm placeholder-gray-400 dark:placeholder-gray-500" id="contact" name="contact" placeholder="Email or phone number" type="text"/>
</div>
</div>
<div class="pt-4 flex justify-end">
<button class="w-full md:w-auto flex items-center justify-center gap-2 bg-primary text-white font-bold py-3 px-6 rounded-lg hover:bg-primary/90 transition-colors" type="submit">
<span class="material-symbols-outlined">send</span>

            </button>
